name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` starts a run when the `windows-bundle` label is added to an open pull
    # request. Any other label restarts the run too: a run that skipped its jobs for an
    # unrelated label would report a green `ci-ok` for a commit nobody tested.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue tests each pull request on top of main and of the ones queued before
  # it, so two pull requests that are green on their own cannot turn main red together.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes. Runs on main (push or
# workflow_dispatch) and merge queue runs are never cancelled, so every main commit and
# every queue entry keeps a full result: each gets its own group (the run id), because a
# group holds at most one pending run and a newer one cancels it even with
# cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tauri 2 on Ubuntu 22.04+: WebKitGTK 4.1, the tray (AppIndicator), SVG icons,
  # AppImage tooling, and D-Bus for the Secret Service credential store.
  LINUX_BUILD_PACKAGES: >-
    build-essential pkg-config file patchelf
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    libxdo-dev libssl-dev libdbus-1-dev

jobs:
  # Decides whether a pull request touches anything that can change the build. A PR
  # that only edits docs skips the jobs gated on `code` (they still report, as skipped).
  # Pushes to main, merge queue runs and manual runs always set `code` to true: nothing
  # is skipped there.
  changes:
    name: detect changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter lists the PR's files through the API
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      # The systems the `bundle` job builds for. The Windows bundle is the slowest job
      # (about 7.5 minutes), so pull requests and the merge queue leave it out: the `rust`
      # job still compiles, lints and tests the Windows code there. It runs on pushes to
      # main, on manual runs and on a pull request labelled `windows-bundle` (for changes
      # to the Windows build itself: tauri.conf.json, build.rs, bundled resources).
      bundle-platforms: >-
        ${{ ((github.event_name != 'pull_request' && github.event_name != 'merge_group')
        || contains(github.event.pull_request.labels.*.name, 'windows-bundle'))
        && '["windows-latest", "ubuntu-22.04"]' || '["ubuntu-22.04"]' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # `code` is true when at least one changed file is NOT docs-only. Markdown under
          # src/ and src-tauri/ (agent guides, test fixtures) and the app icons are compiled
          # in, so only top-level docs and GitHub templates count as docs here.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!NOTICE'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'
              - '!.github/dependabot.yml'

  version:
    name: version consistency
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: scripts/check-version.sh

  frontend:
    name: typecheck + test + build
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Reused by the clippy job: tauri::generate_context! embeds dist/ at compile time.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: fmt + clippy + test (${{ matrix.platform }})
    timeout-minutes: 40
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    # macOS is not built here: its runners are slow to start and made every pull request
    # wait. The same steps run on macOS in macos.yml (main, nightly, manual runs and pull
    # requests labelled `macos`), and nothing here waits for them.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_BUILD_PACKAGES }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # PRs restore main's cache but do not save their own: each run would otherwise
          # upload ~0.5-1 GiB per OS and push main's caches out of the 10 GB repo quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri::generate_context! embeds the built frontend, so clippy needs dist/
      # (built once by the frontend job instead of installing Node here).
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: cargo fmt
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # The app bundles no Node.js (it downloads the pinned release on demand), so fmt /
      # clippy / tests stay network-free; build.rs compiles the pinned checksums in.
      # Each OS compiles its own `cfg` code (keep awake, tray icon, credential store).
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Tests that touch the real OS credential store are #[ignore]d.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: desktop bundle (${{ matrix.platform }})
    timeout-minutes: 45
    needs: [changes, frontend]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux always; Windows only where `changes` adds it (see `bundle-platforms`).
        platform: ${{ fromJSON(needs.changes.outputs.bundle-platforms) }}
    # macOS is not built here: its runners are slow to start and made every pull request
    # wait. The same steps run on macOS in macos.yml (main, nightly, manual runs and pull
    # requests labelled `macos`), and nothing here waits for them.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_BUILD_PACKAGES }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # PRs restore main's cache but do not save their own: each run would otherwise
          # upload ~0.5-1 GiB per OS and push main's caches out of the 10 GB repo quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: pnpm install --frozen-lockfile
      # The Node.js archive checksums the app pins must match Node's GPG-signed SHASUMS256.txt.
      - name: Verify pinned Node.js checksums
        shell: bash
        env:
          GRAPHRT_REQUIRE_NODE_SIGNATURE: "1"
        run: scripts/fetch-node.sh --verify-checksums
      - run: pnpm tauri build --no-bundle

  # The one check to require in the branch ruleset (and so in the merge queue). It always
  # runs, fails when a job above failed or was cancelled, and passes when each one
  # succeeded or was skipped (a docs-only pull request skips the jobs gated on `code`).
  # A matrix entry that was left out (the Windows bundle on a pull request) creates no job,
  # so `bundle` then reports the result of the Linux bundle alone.
  # It does not depend on macOS (macos.yml): a red macOS run is reported, it blocks no merge.
  ci-ok:
    name: ci-ok
    timeout-minutes: 5
    needs: [changes, version, frontend, rust, bundle]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the result of every job
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad="$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::These jobs did not pass: $bad"
            exit 1
          fi
