name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch or PR cancels the run it supersedes (never on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Tauri 2 on Ubuntu 22.04+: WebKitGTK 4.1, the tray (AppIndicator), SVG icons,
  # AppImage tooling, and D-Bus for the Secret Service credential store.
  LINUX_BUILD_PACKAGES: >-
    build-essential pkg-config file patchelf
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    libxdo-dev libssl-dev libdbus-1-dev

jobs:
  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/check-version.sh

  frontend:
    name: typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Reused by the clippy job: tauri::generate_context! embeds dist/ at compile time.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  rust:
    name: fmt + clippy + test (${{ matrix.platform }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_BUILD_PACKAGES }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri::generate_context! embeds the built frontend, so clippy needs dist/
      # (built once by the frontend job instead of installing Node here).
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: cargo fmt
        if: runner.os == 'macOS'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # No Node sidecar here on purpose: build.rs drops `externalBin` for debug
      # builds without it, so fmt / clippy / tests stay network-free.
      # Each OS compiles its own `cfg` code (keep awake, tray icon, credential store).
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Tests that touch the real OS credential store are #[ignore]d.
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: desktop bundle (${{ matrix.platform }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_BUILD_PACKAGES }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # The Node.js sidecar for the runner's target (checksum + signature verified).
      - name: Fetch bundled Node.js
        shell: bash
        env:
          GRAPHRT_REQUIRE_NODE_SIGNATURE: "1"
        run: scripts/fetch-node.sh
      - run: pnpm tauri build --no-bundle
