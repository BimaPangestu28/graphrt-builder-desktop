name: Release

# Push a tag like `v0.2.0` to build the desktop app for macOS (universal),
# Windows (x64: .msi + NSIS .exe) and Linux (x64 and arm64: .AppImage, .deb,
# .rpm) and attach the bundles plus SHA256SUMS to a DRAFT GitHub
# Release whose body is the matching CHANGELOG.md section. A maintainer reviews
# the draft and publishes it by hand. See CONTRIBUTING.md > Releasing.
#
# Auto-update (required repository secrets): every bundle is also signed for
# tauri-plugin-updater, and `latest.json` plus the `.sig` files are attached.
# Installed apps read `releases/latest/download/latest.json`, so an update
# reaches users once the draft is published.
#   TAURI_SIGNING_PRIVATE_KEY           contents of the minisign private key
#                                       (its public key is in tauri.conf.json)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#
# Optional macOS signing and notarization (repository secrets). When they are
# absent the app is ad-hoc signed and users open it with right-click > Open:
#   APPLE_CERTIFICATE           base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple ID email used for notarization
#   APPLE_PASSWORD              app-specific password for that Apple ID
#   APPLE_TEAM_ID               10-character team id
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Same list as ci.yml (Tauri 2 on Ubuntu 22.04 + D-Bus for the Secret Service).
  LINUX_BUILD_PACKAGES: >-
    build-essential pkg-config file patchelf
    libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
    libxdo-dev libssl-dev libdbus-1-dev
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: check version + create draft release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versions match the tag
        run: scripts/check-version.sh "$RELEASE_TAG"
      - name: Release notes from CHANGELOG.md
        # Same layout as scripts/release-macos-local.sh: "What's new", then "Download", where
        # platform blocks (<!-- name:start/end -->) are added by scripts/merge-release-notes.py.
        run: |
          {
            echo "## What's new"
            echo
            scripts/changelog-section.sh "$RELEASE_TAG"
            echo
            echo "Installed apps are offered this update automatically."
            echo
            echo "## Download"
            echo
            echo "Checksums of every file are in \`SHA256SUMS\`."
          } > release-notes.md
          cat release-notes.md
      - name: Create (or reuse) the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafts are not reachable through /releases/tags/<tag>, so search the list.
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | \"\(.id) \(.draft)\"" | head -n 1)"
          if [ -n "$existing" ]; then
            read -r release_id is_draft <<<"$existing"
            if [ "$is_draft" != "true" ]; then
              echo "::error::Release $RELEASE_TAG is already published; refusing to change it."
              exit 1
            fi
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F body=@release-notes.md --silent
            echo "Reusing draft release $release_id"
          else
            release_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$RELEASE_TAG" -f name="Graphrt Desktop ${RELEASE_TAG#v}" -F draft=true \
              -F body=@release-notes.md --jq .id)"
            echo "Created draft release $release_id"
          fi
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: bundle (${{ matrix.name }})
    # The universal macOS build compiles twice and may wait on notarization.
    timeout-minutes: 90
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - name: Windows
            platform: windows-latest
            rust-targets: ""
            args: --bundles msi,nsis
          # Built on the oldest supported Ubuntu so the AppImage / .deb run on
          # newer glibc distributions too.
          - name: Linux x64
            platform: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb,rpm
          - name: Linux arm64
            platform: ubuntu-22.04-arm
            rust-targets: ""
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.LINUX_BUILD_PACKAGES }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.platform }}
      - run: pnpm install --frozen-lockfile
      # Node.js is not bundled: the app downloads the pinned release on demand and checks it
      # against the checksums build.rs compiles in. Those must match the GPG-signed list.
      - name: Verify pinned Node.js checksums
        shell: bash
        env:
          GRAPHRT_REQUIRE_NODE_SIGNATURE: "1"
        run: scripts/fetch-node.sh --verify-checksums
      - name: Configure macOS signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Only export variables that are set: the Tauri bundler treats an empty
          # APPLE_CERTIFICATE as "import this certificate" and would fail.
          export_variable() {
            { echo "$1<<__APPLE_ENV__"; printf '%s\n' "$2"; echo "__APPLE_ENV__"; } >> "$GITHUB_ENV"
          }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            export_variable APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            export_variable APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            export_variable APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "Signing with a Developer ID certificate."
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              export_variable APPLE_ID "$APPLE_ID"
              export_variable APPLE_PASSWORD "$APPLE_PASSWORD"
              export_variable APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "Notarization enabled."
            else
              echo "::warning::APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not set: the app is signed but not notarized."
            fi
          else
            # Ad-hoc signature so the universal binary launches on Apple silicon;
            # Gatekeeper still asks users to confirm (right-click > Open).
            export_variable APPLE_SIGNING_IDENTITY "-"
            echo "::warning::Apple signing secrets not set: building an unsigned (ad-hoc) macOS app."
          fi
      # `createUpdaterArtifacts` is on, so the build fails without the key: say why first.
      - name: Updater signing key is set
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set: updater bundles cannot be signed (CONTRIBUTING.md > Releasing)."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Signs the updater bundles (.app.tar.gz, NSIS / MSI, AppImage, deb, rpm) -> .sig
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          # Each job adds its platforms to the release's latest.json (the universal
          # macOS build is listed for both darwin-aarch64 and darwin-x86_64).
          includeUpdaterJson: true
          # Windows updates install through the NSIS installer (same as a fresh install).
          updaterJsonPreferNsis: true

  checksums:
    name: SHA256SUMS
    timeout-minutes: 15
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir bundles
          rm -f bundles/SHA256SUMS
      - name: Compute checksums
        working-directory: bundles
        run: |
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS
      - name: Attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
