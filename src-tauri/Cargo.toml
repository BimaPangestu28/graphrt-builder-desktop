[package]
name = "graphrt"
version = "0.2.1"
description = "graphrt desktop: build, test and run automation agents on your computer (macOS, Windows, Linux)"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/BimaPangestu28/graphrt-builder-desktop"
publish = false
# Tauri 2.12 and its plugins need Rust 1.90 (graphrt itself needs 1.85)
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519)
name = "graphrt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[features]
default = ["phone-access"]
# Phone access (Settings > Phone access): this computer serves the monitoring page of
# graphrt to paired phones, on the local network or the person's own Tailscale. Off at
# run time until the person turns it on; a build without the feature has none of its code.
phone-access = ["dep:graphrt-cli", "dep:axum", "dep:if-addrs", "tokio/net"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2.0.0"
tauri-plugin-dialog = "2.4"
tauri-plugin-notification = "2.8.1"

# graphrt runtime, pinned to a commit until the crates are published on crates.io
# (a commit of graphrt main; all graphrt crates share the same rev)
graphrt-core = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
graphrt-llm = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84", default-features = false, features = ["openai", "anthropic", "gemini", "mock", "skills", "learning", "text-model", "tool-files", "vision-preparer"] }
graphrt-http = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
# Knowledge bases: SQLite vector store, document extractors and OpenAI-compatible embeddings
graphrt-rag = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84", default-features = false, features = ["sqlite", "doc", "http"] }
# Plugins: node kinds and tools from external processes (graphrt-plugins catalog)
graphrt-plugin = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84", default-features = false, features = ["process", "http", "yaml", "mcp-presets"] }
# MCP servers configured in Connections > Advanced: their tools for `tool` / `agent` nodes (stdio and Streamable HTTP)
graphrt-mcp = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
# "My own server": exporting an agent as a portable .grt bundle for `graphrt serve` (no WebAssembly plugins)
graphrt-bundle = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84", default-features = false }
# UI blocks (cards, charts, tables, KPI tiles, diagrams): validation before a screen renders them, and their
# text / PNG form for chat channels that cannot draw them (`png`: charts as images)
graphrt-ui = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84", features = ["png"] }
# Agent skills: SKILL.md packages pinned and checked at install, loaded by `agent` nodes on demand
graphrt-skill = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
# Self learning: lessons a person approves, read by `agent` nodes; feedback becomes proposals
graphrt-learn = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
# Files and images for agents that use them (`agent_files`): a workspace per agent with the
# `files`, `documents` and `image` tools, and the gate every image passes before a model sees it.
graphrt-files = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
graphrt-image = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
graphrt-docgen = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84" }
# Phone access (feature `phone-access`): the device tokens, the approvals inbox and the Web Push
# notifier of `graphrt serve` (graphrt#136), reused for agents that run on this computer. Only
# those features: no workflow runner of the CLI and none of its `serve` routes are used.
graphrt-cli = { git = "https://github.com/Graphrt/graphrt", rev = "0add2d50cfa23a6d63c2f02c747b6195a85bfd84", default-features = false, features = ["web-push", "approvals"], optional = true }
# The small HTTP server of Phone access (the same axum version graphrt serve uses).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"], optional = true }
# The computer's network addresses, to serve Phone access on the Wi-Fi / cable one only.
if-addrs = { version = "0.15", optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
# Writing workflow documents edited in the Nodes view back to YAML (same crate graphrt-core reads them with).
serde-saphyr = "2"
thiserror = "2"
# Same version as graphrt-rag's SqliteStore: a binary can link only one bundled SQLite.
# `fallible_uint` keeps `usize`/`u64` parameters working as they did in 0.32.
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
# OS credential stores: macOS Keychain, Windows Credential Manager, and the
# Secret Service on Linux (GNOME Keyring / KWallet over D-Bus; needs libdbus-1 to build).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
cron = "0.17"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4"] }
# Plugin catalog and tarball downloads (HTTPS only), checksum and safe extraction.
# Same reqwest / rustls setup as graphrt-http (ring provider, no default features).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
# MCP OAuth sign-in: parsing and building authorization URLs and form bodies, and the PKCE
# verifier / state (both already in the dependency tree through reqwest and uuid).
url = "2"
getrandom = "0.3"
tar = { version = "0.4", default-features = false }
flate2 = "1"
# The Node.js runtime is downloaded on demand: `.tar.xz` on macOS/Linux, `.zip` on Windows
# (same zip crate and version graphrt-doc already uses).
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
# Live view frames are sent to the UI as JPEG data URLs.
base64 = "0.23"
# Crash reports: redacting tokens, keys and emails before a report is written.
regex = "1"
# Local CLI providers (Claude Code, Codex) run in a throwaway working directory.
tempfile = "3"
minisign-verify = "0.3"

# Launch at login and one running instance are desktop-only
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7.0"
# Starting graphrt again focuses the running window (the only way back on Linux
# desktops that hide tray icons, e.g. GNOME without the AppIndicator extension).
tauri-plugin-single-instance = "2"
# Auto-update from GitHub Releases (signed `latest.json`, see `desktop::updater`) and
# the relaunch after installing. rustls-tls only, like the rest of the app.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-process = "=2.4.0"

# Sideloading opens each file with O_NOFOLLOW, so a link swapped in is never followed
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Secret Service client `keyring` uses on Linux, to tell its failures apart (no
# default keyring, no keyring service, locked) when `keyring` reports them all the same.
[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service = "4"

# "Keep the computer awake while an agent runs" on Windows (SetThreadExecutionState)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
minisign = "0.10.0"
# Tests build .tar.xz fixtures of the Node runtime archive.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
# Tests encode a large photo to check that attaching it does not block (the version graphrt-image uses).
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

# Tests build the D-Bus errors of a missing Secret Service (the version `keyring` uses).
[target.'cfg(target_os = "linux")'.dev-dependencies]
dbus = "0.9"

# Release profile, measured on Apple Silicon (see the Performance notes in CHANGELOG.md):
# size-optimized code (`z`) with fat LTO shrinks the binary from 29.1 to 16.7 MB.
# The crates on the hot path of a run (the graphrt-core engine, serde_json, tokio) stay
# at `opt-level = 3`, which keeps graphrt-core's engine benchmark at the speed of an
# all-`3` build (`z` everywhere was ~45% slower there). Everything else is I/O bound
# (HTTP, SQLite, model calls) or runs once (UI setup).
# `panic` stays "unwind": `desktop::setup` catches the panic of the Linux tray backend
# when libayatana-appindicator is missing.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

[profile.release.package.graphrt-core]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.tokio]
opt-level = 3
