# Judge of a test with a good answer written by the person (see `quality::suite`).
# MODEL_PROVIDER and MODEL_NAME are replaced with the app's default model before compiling.
#
# Two steps. `handoff` only states facts about passing the chat to the owner; whether such a
# hand-off is a good answer is decided by `right_handoff`, not by a model (small models wrote
# "the reply hands over like the good answer" and still said fail): a reply that hands over
# passes when the good answer hands over too, or when the agent's rules pass this kind of
# question to the owner. Every other reply goes to `judge`, which checks the content.
version: "1"
name: judge-good-answer
description: Pass when the reply gives what the good answer says, or hands over when it should.
graph:
  nodes:
    - id: start
      type: start
      variables:
        - { variable: output, type: paragraph, required: true }
        - { variable: expected, type: paragraph, required: true }
        - { variable: question, type: paragraph, required: true }
        - { variable: language, type: text-input, required: false }
        - { variable: handoff_rules, type: paragraph, required: false }

    - id: handoff
      type: llm
      model: { provider: MODEL_PROVIDER, name: MODEL_NAME, completion_params: { temperature: 0 } }
      prompt_template:
        - role: system
          text: |
            You read one reply of a business's assistant. State three facts, true or false:
            - reply_hands_over: the REPLY says the owner or a person will reply, take over or
              get back to the customer.
            - good_answer_hands_over: the GOOD ANSWER (written by the owner) says that too,
              or says the assistant does not know or will ask someone.
            - question_is_a_handoff_case: the QUESTION itself is one of these cases (judge the
              question, not the reply): {{#start.handoff_rules#}}
            Then one short sentence a shop owner understands, in {{#start.language#}}, that
            says what the reply does about the owner, for example "The reply passes the order
            to the owner, as the good answer does." or "The reply answers itself."
        - role: user
          text: |
            Answer in JSON with the keys reply_hands_over, good_answer_hands_over,
            question_is_a_handoff_case and sentence.

            QUESTION:
            {{#start.question#}}

            GOOD ANSWER:
            {{#start.expected#}}

            REPLY:
            {{#start.output#}}
      structured_output:
        schema:
          type: object
          required: [reply_hands_over, good_answer_hands_over, question_is_a_handoff_case, sentence]
          additionalProperties: false
          properties:
            reply_hands_over: { type: boolean }
            good_answer_hands_over: { type: boolean }
            question_is_a_handoff_case: { type: boolean }
            sentence: { type: string }

    - id: right_handoff
      type: if-else
      cases:
        - case_id: like_the_good_answer
          logical_operator: and
          conditions:
            - { variable_selector: [handoff, structured_output, reply_hands_over], comparison_operator: is, value: "true" }
            - { variable_selector: [handoff, structured_output, good_answer_hands_over], comparison_operator: is, value: "true" }
        - case_id: by_the_rules
          logical_operator: and
          conditions:
            - { variable_selector: [handoff, structured_output, reply_hands_over], comparison_operator: is, value: "true" }
            - { variable_selector: [handoff, structured_output, question_is_a_handoff_case], comparison_operator: is, value: "true" }

    - id: handed_over
      type: template-transform
      template: "pass"
      variables: []

    - id: end_handed_over
      type: end
      outputs:
        - { variable: verdict, value_selector: [handed_over, output] }
        - { variable: reasoning, value_selector: [handoff, structured_output, sentence] }

    - id: judge
      type: llm
      model: { provider: MODEL_PROVIDER, name: MODEL_NAME, completion_params: { temperature: 0 } }
      prompt_template:
        - role: system
          text: |
            You check one reply of a business's assistant. The owner wrote what a good
            reply says. Decide one thing only: does the REPLY give the facts and the
            meaning of the GOOD ANSWER? Other wording, extra polite words and extra helpful
            details are fine. A reply that leaves out a fact of the good answer, says
            something that contradicts it, or does not answer fails. When the good answer
            itself says the assistant does not know, will ask someone, or hands the question
            to a person, a reply that does the same passes.
            - pass: the reply gives what the good answer says.
            - fail: it misses or contradicts part of it, or does not answer.
            - unknown: the good answer itself cannot be understood.
            Write the reasoning first: one short sentence a shop owner understands, written
            in {{#start.language#}}. Call them the question, the reply and the good answer
            in plain words, not the labels in capitals. Then the verdict.
        - role: user
          text: |
            Answer in JSON. Write the reasoning in {{#start.language#}}.

            QUESTION:
            {{#start.question#}}

            GOOD ANSWER (written by the owner):
            {{#start.expected#}}

            REPLY:
            {{#start.output#}}
      structured_output:
        schema:
          type: object
          required: [reasoning, verdict]
          additionalProperties: false
          properties:
            reasoning: { type: string }
            verdict: { type: string, enum: [pass, fail, unknown] }

    - id: end
      type: end
      outputs:
        - { variable: verdict, value_selector: [judge, structured_output, verdict] }
        - { variable: reasoning, value_selector: [judge, structured_output, reasoning] }

  edges:
    - { source: start, target: handoff }
    - { source: handoff, target: right_handoff }
    - { source: right_handoff, target: handed_over, handle: like_the_good_answer }
    - { source: right_handoff, target: handed_over, handle: by_the_rules }
    - { source: handed_over, target: end_handed_over }
    - { source: right_handoff, target: judge, handle: "false" }
    - { source: judge, target: end }
